name: Check Matrix

on:
  pull_request: {}

permissions: read-all

jobs:
  preliminary:
    name: Preliminary Sanity Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Spotless (license header)
        run: ./gradlew clean spotlessCheck -PspotlessFrom=origin/${{ github.base_ref }}
      - name: API Compatibility
        run: ./gradlew clean japicmp
      - name: Check Firewall Status (Linux)
        if: runner.os == 'Linux'
        run: sudo systemctl status firewalld || echo "Firewall service not found"

  build:
    needs: preliminary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2019]
        transport: [native, nio]
        exclude:
          - os: windows-2019
            transport: native
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v3
      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Verify Server Availability
        run: |
          netstat -tulnp || echo "Netstat command failed (might not be installed)"
          curl -v http://localhost:39213 || echo "Server might not be running"

      - name: Build and Run Tests with Debug Logs
        run: ./gradlew clean check --debug --no-daemon -x spotlessCheck -PforceTransport=${{ matrix.transport }}

      - name: Run TcpClientTests.testBootstrap in Isolation
        if: failure()
        run: |
          echo "Isolating failing test: TcpClientTests.testBootstrap"
          ./gradlew :reactor-netty-core:test --tests TcpClientTests.testBootstrap
